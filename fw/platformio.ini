[env:raspberrypi_pico]
platform = raspberrypi
board = raspberrypi_pico
framework = arduino

# Custom USB VID/PID (replace with your values)
board_build.usb_vendor_id = 0x1234
board_build.usb_product_id = 0xABCD

# Monitor speed
monitor_speed = 115200

# Microchip CryptoAuthLib for ATECC608A support
lib_deps = 
	https://github.com/MicrochipTech/cryptoauthlib.git
lib_ldf_mode = deep
